<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker - Remove Record</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="cute.PNG" type="image/png">
</head>
<body>
    <div class="master-frame">
        <h2>Remove a Plan</h2>
        
        <div id="alertBox" class="alert" style="display: none;"></div>

        <form id="removeForm" style="display: none;">
            <div class="form-group">
                <label for="removeSelect">Select a plan to remove:</label>
                <select id="removeSelect" required></select>
            </div>
            
            <div class="form-group">
                <label for="confirmInput">⚠️ Type <strong>DELETE</strong> to confirm deletion:</label>
                <input type="text" id="confirmInput" placeholder="Type DELETE here" required>
            </div>

            <button type="submit" id="submitBtn" style="background-color: #dc3545;">Delete Plan</button>
        </form>

        <div id="noPlansMsg" style="display: none; text-align: center;">
            <p style="color: #721c24; font-weight: bold;">No plans found.</p>
        </div>

        <div class="nav-links" style="margin-top: 20px;">
            <a href="dashboard.html">← Back to Dashboard</a>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const alertBox = document.getElementById("alertBox");
        const removeForm = document.getElementById("removeForm");
        const noPlansMsg = document.getElementById("noPlansMsg");
        const removeSelect = document.getElementById("removeSelect");
        const confirmInput = document.getElementById("confirmInput");

        function showAlert(message, type = "error") {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = "block";
        }

        const data = loadTrackerData();
        const plans = data.plans || {};
        const planNames = Object.keys(plans);

        if (planNames.length === 0) {
            noPlansMsg.style.display = "block";
            removeForm.style.display = "none";
        } else {
            noPlansMsg.style.display = "none";
            removeForm.style.display = "block";

            planNames.forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                option.textContent = name;
                removeSelect.appendChild(option);
            });
        }

        removeForm.addEventListener("submit", async function(e) {
            e.preventDefault();
            alertBox.style.display = "none";

            const selectedPlan = removeSelect.value;
            const confirmationText = confirmInput.value.trim();

            if (confirmationText !== "DELETE") {
                showAlert("Deletion cancelled. You must type 'DELETE' in uppercase to confirm.", "error");
                return;
            }

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.textContent = "Deleting from Google Drive...";

            try {
                await mutateAndSaveTrackerData((currentData) => {
                    if (currentData.plans && currentData.plans[selectedPlan]) {
                        delete currentData.plans[selectedPlan];
                    }
                    return currentData;
                });

                showAlert(`Plan '${selectedPlan}' has been deleted successfully from Google Drive.`, "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1500);
            } catch (err) {
                console.error(err);
                showAlert("Failed to sync deletion with Google Drive.", "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Delete Plan";
            }
        });
    </script>
</body>
</html>
